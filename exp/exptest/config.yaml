seed: 42
output_dir: results/manual_train
data:
  train_dir: images/train_sf
  split_ratio:
  - 0.0
  - 1.0
  - 0.0
  cuda_image_folder: true
  pin_memory: true
  num_workers: 6
model:
  pretrained: true
train:
  epochs: 4
  batch_size: 256
  learning_rate: 0.0009
  evaluate: false
runtime:
  autocast: true
  profiler: false
image_size:
- 224
- 224
normalize:
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
output:
  model: model.pth
  class_map: map.json
  metrics: metrics.txt
